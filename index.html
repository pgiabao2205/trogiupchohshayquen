function lightbox(L,i){const m=document.createElement('div');m.className='lb';let sx=0;const show=()=>{m.innerHTML=`<img src="${L[i].f}" alt="Ảnh bài tập"><button class=lbx data-x aria-label="Đóng">✕</button>${L.length>1?`<button class="lbn l" data-n=-1 aria-label="Ảnh trước">‹</button><button class="lbn r" data-n=1 aria-label="Ảnh sau">›</button><div class=lbc>${i+1}/${L.length}</div>`:''}`},go=n=>{i=(i+n+L.length)%L.length;show()};show();m.onclick=e=>{const n=e.target.closest('[data-n]');if(n){go(+n.dataset.n);return}if(e.target.closest('[data-x]')||e.target===m){m.classList.add('out');setTimeout(()=>m.remove(),200)}};m.ontouchstart=e=>{sx=e.touches[0].clientX};m.ontouchend=e=>{if(e.touches.length||L.length<2)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(dx<0?1:-1)};document.body.append(m)}
function imgPicker(m,im){const c=m.querySelector('#tim'),draw=()=>{const u=Math.min(99,Math.round(((localStorage.getItem(K)||'').length+(localStorage.getItem(K2)||'').length)/50000));c.innerHTML=`<div class=thumbs style="flex-wrap:wrap;padding:0">${im.map((x,i)=>`<span class=thw><button class=th style="background-image:url(${x.t})" data-lb=${i} aria-label="Xem ảnh"></button><button class=rm data-rm=${i} aria-label="Xóa ảnh">✕</button></span>`).join('')}${im.length<6?`<label class="th add" aria-label="Thêm ảnh">+<input type=file accept="image/*" multiple hidden></label>`:''}</div><p class=mu style="margin:8px 0 0">Tối đa 6 ảnh, tự nén nhỏ. Bộ nhớ đã dùng ~${u}%.</p>`;const f=c.querySelector('input');if(f)f.onchange=async()=>{const fs=[...f.files].slice(0,6-im.length);let bad=0;for(const x of fs){try{im.push(await pack(x))}catch(e){bad++}}if(bad)toast('Có ảnh không đọc được');draw()}};
c.onclick=e=>{const b=e.target.closest('[data-rm]');if(b){im.splice(+b.dataset.rm,1);draw();return}const v=e.target.closest('[data-lb]');if(v)lightbox(im,+v.dataset.lb)};draw()}
function todoSheet(x,s){const im=(x&&x.imgs||[]).slice();const m=sheet(x?'Sửa công việc':s?'Bài tập mới':'Công việc mới',[{k:'t',l:'Tên công việc',v:x?x.t:''},{k:'im',l:'Ảnh ghi nhớ',t:'html',h:'<div id=tim></div>'},{k:'cat',l:'Phân loại',t:'sel',o:[['','Không phân loại'],...allCats().map(c=>[c,c])],v:x&&x.cat||''},{k:'cat2',l:'Hoặc nhập phân loại khác (không bắt buộc)',v:''},{k:'pr',l:'Mức ưu tiên',t:'sel',o:Object.keys(PR).map(k=>[k,PR[k]]),v:x?x.pr||'n':'n'},{k:'st',l:'Trạng thái',t:'sel',o:Object.keys(ST).map(k=>[k,ST[k]]),v:x?x.st||(x.d?'done':'todo'):'todo'},{k:'due',l:'Hạn (không bắt buộc)',t:'date',v:x&&x.due||''},{k:'sub',l:'Môn học',t:'sel',o:subOpts(),v:x&&x.sub||''}],v=>{if(!v.t.trim())return;dirty=1;const o={t:v.t.trim(),cat:(v.cat2||'').trim()||v.cat,pr:v.pr,st:v.st,due:v.due,sub:v.sub,d:v.st=='done'?1:0,imgs:im};o.dd=o.d?dkey(0):'';if(x)Object.assign(x,o);else S.todos.unshift({id:uid(),s:s?1:0,...o})},x&&(()=>{dirty=1;S.todos=S.todos.filter(t=>t!==x)}));imgPicker(m,im)}
function ideaSheet(n){sheet(n?'Sửa ý tưởng':'Ý tưởng mới',[{k:'t',l:'Tên ý tưởng',v:n?n.t:''},{k:'x',l:'Mô tả',t:'ta',v:n?n.x:''},{k:'c',l:'Phân loại',t:'sel',o:CATS.map(c=>[c,c]),v:n?n.c:CATS[0]}],v=>{const o={t:v.t.trim()||'Không tiêu đề',x:v.x,c:v.c};if(n)Object.assign(n,o);else S.ideas.unshift({id:uid(),...o})},n&&(()=>{S.ideas=S.ideas.filter(x=>x!=n)}))}
function search(q){q=q.trim().toLowerCase();const r=$('#res');if(!q){r.innerHTML='';return}
const R=[...S.todos.filter(x=>x.t.toLowerCase().includes(q)).map(x=>['Việc',x.t,'work','']),...S.notes.filter(x=>(x.t+x.x).toLowerCase().includes(q)).map(x=>['Ghi chú',x.t,'study','note']),...S.ideas.filter(x=>(x.t+x.x).toLowerCase().includes(q)).map(x=>['Ý tưởng',x.t,'idea','']) ].slice(0,8);
r.innerHTML=R.length?R.map(x=>`<button class="li" style="width:100%;text-align:left;margin-top:4px" data-a=go data-t=${x[2]} data-st=${x[3]}><span class=chip>${x[0]}</span><span class=sp>${esc(x[1])}</span></button>`).join(''):'<p class=mu>Không tìm thấy kết quả.</p>'}
document.addEventListener('click',e=>{const t=e.target;if(t.classList&&t.classList.contains('sheetbg')){closeM(t);return}const b=t.closest('[data-sh],[data-a]');if(!b)return;if(b.dataset.sh){b.closest('.sheetbg')._h(b.dataset.sh,b);return}const f=A[b.dataset.a];if(f)f(b.dataset,b)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='q')search(t.value);else if(t.id=='iq'){iq=t.value;$('#il').innerHTML=ideaList()}else if(t.id=='wq'){W.q=t.value;$('#wl').innerHTML=workList()}else if(t.dataset.ct!==undefined){S.ct=+t.value;save();theme()}else if(t.dataset.rt!==undefined){if(t.value){S.rt=t.value;save()}}else if(t.dataset.rg!==undefined){S.bgs=+t.value;save();theme()}else if(t.dataset.cc!==undefined){S.accent=t.value;save();theme();document.querySelectorAll('#setm [data-a=acc]').forEach(x=>x.classList.remove('on'))}else if(t.id=='nq'){nq=t.value;$('#nl').innerHTML=noteList()}else if(t.dataset.n){S[t.dataset.n]=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(t.dataset.wf){W[t.dataset.wf]=t.value;swap($('#wl'),workList(),0);return}if(t.dataset.ps!==undefined){S.p.sub=t.value;save();return}if(f&&t.files[0])img(t.files[0],f=='avatar'?256:1080,f=='avatar',u=>{if(!u){toast('Không đọc được ảnh');return}S[f]=u;dirty=1;save();refreshSet();render()})});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='nt')A.addtodo()});
document.addEventListener('visibilitychange',tick);
let dp=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;refreshSet()});
window.addEventListener('appinstalled',()=>{dp=null;toast('Đã cài đặt app');refreshSet()});
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
function notify(title,body){if(!S.nt||!('Notification' in window)||Notification.permission!='granted')return;const o={body,icon:'icon-192.png',badge:'icon-192.png'},f=()=>{try{new Notification(title,o)}catch(e){}};if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration().then(g=>g?g.showNotification(title,o):f()).catch(f);else f()}
function checkDue(){if(!S.nt)return;const n=new Date,t=dkey(0),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');let c=0;
if(S.ld!=t&&hm>=S.rt){S.ld=t;c=1;const o=S.todos.filter(x=>!x.d).length;if(o)notify('Bảo Hub','Hôm nay còn '+o+' việc cần làm.')}
S.todos.filter(x=>!x.d&&x.due&&x.due<=t&&S.nd[x.id]!=t).forEach(x=>{S.nd[x.id]=t;c=1;notify(x.due<t?'Việc quá hạn':'Đến hạn hôm nay',x.t)});if(c)save()}
document.addEventListener('visibilitychange',checkDue);setInterval(checkDue,60000);
setInterval(tick,1000);render(1);checkDue();window.addEventListener('resize',segAll);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(segAll);try{new ResizeObserver(()=>{nsize();if(!NF.raf)draw(0)}).observe($('#nav'))}catch(e){}const dq=matchMedia('(prefers-color-scheme:dark)');if(dq.addEventListener)dq.addEventListener('change',theme);if(railQ.addEventListener)railQ.addEventListener('change',()=>{nsize();if(!NF.raf)draw(0)});
